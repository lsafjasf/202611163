<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>双卷扬机吊装仿真</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>双卷扬机吊装仿真</h1>
    <div class="global-controls">
      <button id="btn-run" class="primary">运行</button>
      <button id="btn-pause">暂停</button>
      <button id="btn-step">单步</button>
      <button id="btn-reset">重置</button>
      <button id="btn-replay">回放</button>
      <button id="btn-rerun">确定性复算</button>
      <label class="auto-label">
        <input type="checkbox" id="chk-auto" checked /> 自动控制
      </label>
      <label class="auto-label">
        <input type="checkbox" id="chk-force" checked /> 显示受力/趋势
      </label>
      <label class="auto-label">
        <input type="checkbox" id="chk-sound" /> 张力音效
      </label>
    </div>
  </header>

  <main class="layout">
    <section class="canvas-wrap">
      <canvas id="scene" width="900" height="560"></canvas>
      <div id="trip-banner" class="trip-banner hidden"></div>
      <div class="legend">
        <span>红箭头：绳张力</span>
        <span>蓝箭头：速度趋势</span>
        <span>绿虚线：目标高度</span>
      </div>
    </section>

    <aside class="side">
      <div id="panel-A" class="hoist-panel"></div>
      <div id="panel-B" class="hoist-panel"></div>
    </aside>
  </main>

  <section class="bottom">
    <div class="log-panel">
      <h3>事件与最近变化</h3>
      <ul id="event-log"></ul>
    </div>
    <div class="replay-panel">
      <h3>回放控制</h3>
      <input type="range" id="replay-scrub" min="0" max="0" value="0" />
      <div id="replay-info">未开始回放</div>
    </div>
  </section>

  <script src="js/physics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
