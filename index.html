<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维翼型风洞仿真</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>二维翼型风洞仿真</h1>
  <div class="status-badges">
    <span id="badge-run" class="badge">运行中</span>
    <span id="badge-stall" class="badge hidden">失速</span>
    <span id="badge-trip" class="badge hidden">保护触发</span>
    <span class="badge seed">种子 <input id="seed-input" type="number" value="20261116" min="1"></span>
  </div>
</header>

<main class="layout">
  <section class="col col-left">
    <div class="panel">
      <h2>风洞试验段</h2>
      <canvas id="tunnel-canvas" width="620" height="360"></canvas>
      <p class="hint">蓝箭头为来流风线，红/绿箭头为阻力/升力方向；失速后风线出现分离涡。</p>
    </div>
    <div class="panel">
      <h2>特性曲线（升/阻力 vs 迎角）</h2>
      <canvas id="curve-canvas" width="620" height="300"></canvas>
      <p class="hint">实线为当前轨迹，圆点为当前工况；垂直虚线为临界迎角 16°。</p>
    </div>
  </section>

  <section class="col col-right">
    <div class="panel controls">
      <h2>工况控制</h2>
      <label>迎角 α <span class="rng" id="alpha-lim"></span>
        <input id="alpha" type="range" min="-25" max="30" step="0.5" value="4">
        <span class="val"><b id="alpha-val">4.0</b> °</span>
      </label>
      <label>风速 V <span class="rng" id="v-lim"></span>
        <input id="velocity" type="range" min="5" max="80" step="1" value="30">
        <span class="val"><b id="v-val">30</b> m/s</span>
      </label>
      <label>静压 P <span class="rng" id="p-lim"></span>
        <input id="pressure" type="range" min="60000" max="110000" step="500" value="101325">
        <span class="val"><b id="p-val">101.3</b> kPa</span>
      </label>
      <label>温度 T <span class="rng" id="t-lim"></span>
        <input id="temp" type="range" min="253" max="333" step="1" value="293.15">
        <span class="val"><b id="t-val">293.2</b> K</span>
      </label>
      <label class="chk"><input id="noise" type="checkbox" checked> 传感器噪声（确定性）</label>
      <div class="btn-row">
        <button id="btn-pause">暂停</button>
        <button id="btn-step">单步</button>
        <button id="btn-reset" class="warn">重置</button>
      </div>
      <div class="btn-row">
        <button id="btn-average">重复测量×5</button>
        <button id="btn-replay">回放最近段</button>
        <button id="btn-selftest">内置自检</button>
      </div>
      <div class="presets">
        <button data-preset="normal">正常工况</button>
        <button data-preset="limit">极限载荷</button>
        <button data-preset="stall">失稳演示</button>
      </div>
    </div>

    <div class="panel">
      <h2>关键物理量</h2>
      <table id="readout" class="readout"></table>
    </div>

    <div class="panel">
      <h2>最近一次变化</h2>
      <div id="last-change" class="last-change">尚无变化</div>
    </div>

    <div class="panel">
      <h2>事件与触发记录</h2>
      <ul id="event-log" class="event-log"></ul>
    </div>

    <div class="panel">
      <h2>重复测量（均值 ± 标准差）</h2>
      <table id="avg-table" class="avg-table">
        <tr><th>轮次</th><th>升力 N</th><th>阻力 N</th></tr>
      </table>
    </div>

    <div class="panel hidden" id="selftest-panel">
      <h2>内置自检报告</h2>
      <ul id="selftest-log" class="event-log"></ul>
    </div>
  </section>
</main>

<div id="trip-banner" class="trip-banner hidden"></div>

<script src="js/physics.js"></script>
<script src="js/verify.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
