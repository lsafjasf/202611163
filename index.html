<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>离线游戏 · 版本化存档演示</title>
  <style>
    body { margin: 0; background: #101418; color: #dfe6ee; font-family: monospace; }
    #hud { display: block; margin: 12px auto; background: #000; }
    #bar { text-align: center; margin: 8px; }
    button { font-family: monospace; padding: 6px 14px; margin: 0 4px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="btnSave">保存</button>
    <button id="btnLoad">读取</button>
    <button id="btnStep">模拟一步</button>
    <button id="btnCorrupt">模拟写入中断</button>
  </div>
  <canvas id="hud" width="640" height="480"></canvas>
  <script src="src/crc32.js"></script>
  <script src="src/metrics.js"></script>
  <script src="src/saveManager.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
