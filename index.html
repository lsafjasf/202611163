<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>陀螺平衡校准仿真台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%235aa2ff'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230b1020'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>陀螺平衡校准仿真台</h1>
      <div class="status-pill" id="statusPill">待机</div>
    </header>

    <main class="layout">
      <section class="panel controls">
        <h2>调节参数</h2>
        <div id="sliders"></div>

        <div class="btn-row">
          <button id="btnPause" class="btn">暂停</button>
          <button id="btnStep" class="btn">单步</button>
          <button id="btnReset" class="btn">重置</button>
        </div>
        <div class="btn-row">
          <button id="btnAudio" class="btn ghost">开启音频</button>
          <button id="btnSave" class="btn ghost">保存校准</button>
          <button id="btnLoad" class="btn ghost">读取校准</button>
        </div>

        <h2>验证工况</h2>
        <div id="scenarioBtns" class="btn-row wrap"></div>
        <div class="btn-row">
          <button id="btnReplay" class="btn ghost" disabled>回放</button>
          <button id="btnSelftest" class="btn ghost">运行自检</button>
        </div>
        <div class="btn-row">
          <button id="btnInject" class="btn ghost">注入越限负载 (m=2.4)</button>
        </div>
        <div id="limitWarn" class="limit-warn hidden"></div>
        <div id="selftestOut" class="selftest"></div>
      </section>

      <section class="panel stage">
        <div class="canvas-wrap">
          <h2>姿态球（箭头为校正受力方向）</h2>
          <canvas id="sphere" width="340" height="300"></canvas>
        </div>
        <div class="readouts" id="readouts"></div>
        <div id="tripBanner" class="trip-banner hidden"></div>
      </section>

      <section class="panel charts">
        <h2>角速度</h2>
        <canvas id="omegaChart" width="420" height="150"></canvas>
        <h2>姿态误差</h2>
        <canvas id="errorChart" width="420" height="150"></canvas>
      </section>

      <section class="panel log-panel">
        <h2>事件日志 / 最近一次变化</h2>
        <ul id="eventLog" class="event-log"></ul>
      </section>
    </main>

    <script src="js/rng.js"></script>
    <script src="js/physics.js"></script>
    <script src="js/scenarios.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
